services:
  - type: web
    name: psicampus
    runtime: docker
    plan: free
    region: oregon
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: PORT
        value: 4321
      - key: DATA_DIR
        value: /data
      - key: NODE_ENV
        value: production
      - key: SMTP_ENABLED
        value: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: true
      - key: SMTP_USER
        value: galarzacriss8@gmail.com
      - key: SMTP_FROM
        value: galarzacriss8@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
    disk:
      name: psicampus-data
      mountPath: /data
      sizeGB: 1
